<script id='fragment-shader' type='glsl'>#version 300 es
      
precision highp float;
uniform vec3 camera;
uniform vec3 lightPos[8]; 
in vec3 pos;
in vec3 no;
in vec3 uvi;
precision highp sampler2D;
uniform sampler2D iChannel0;
uniform sampler2D iChannel1;

out vec4 fragColor;


void main(){
vec3 fragCoord=gl_FragCoord.rgb;
vec4 icol=texelFetch(iChannel0,ivec2(uvi.xy*1.0),0);

if(icol.a<0.1){
	discard;
}
fragColor=icol;
//fragColor.rgb=vec3(pos.z/2.0);

vec3 norm=normalize(texelFetch(iChannel1,ivec2(uvi.xy),0).rgb-vec3(0.5,0.5,0.0));
norm.z=(norm.z*norm.z);

norm*=vec3(0.8,0.8,1); 
norm=normalize(norm);

vec3 to=(pos+(camera-lightPos[0])/vec3(180.0,90,1));
float lt=max(dot(norm,normalize(to))*0.1+0.04,0.0);
float lilen=dot(to,to)+0.4;
for(int i=1;i<8;i++){
	if(!(lightPos[i].x==0.0)){
to=(pos+(camera-lightPos[i])/vec3(180.0,90,1));
lt+=max(dot(norm,normalize(to))*0.1+0.04,0.0);
lilen=min(lilen,dot(to,to)+0.4);
}
}
lt*=1.3;
lt/=lilen;
//max((dot(normal, lightDir) + wrap) / (1.0 + wrap), 0.0);
float li=1.0-(atan(abs(pos.z-1.0)*2.0)/1.57);
fragColor.rgb=fragColor.rgb*li*1.5;
fragColor.rgb+=pow(max(lt,0.0),4.0)*0.915*vec3(1.0,0.8,0.6);
fragColor.rgb*=lt;


fragColor.rgb=mix(fragColor.rgb,vec3(0.4,0.38,0.36)/(1.0+3.0*max(pos.z-1.0,0.0)),1.0-exp(-max(pos.z-1.0,0.0) * 1.0-0.07/(lilen-0.2)));

//fragColor.rgb=to;
fragColor.a=icol.a;
//fragColor.rgb=vec3(lilen);

//fragColor.rgb=abs(normalize(norm));
}

<script id='bloom-shader' type='glsl'>#version 300 es
       
precision highp float;
precision highp sampler2D;
uniform sampler2D iChannel0;
uniform float iTime;
uniform vec3 cam;
uniform vec3 pcam;
uniform float hdr;
out vec4 fragColor;

vec4 texelFetchLinear(sampler2D tex, vec2 coord, int lod)
{
    // Integer base coordinate
    ivec2 iCoord=ivec2(floor(coord));
    
    vec2 f=fract(coord);
	f=f * f * (3.0 - 2.0 * f);
    vec4 t00=texelFetch(tex, iCoord, lod);
    vec4 t10=texelFetch(tex, iCoord + ivec2(1, 0), lod);
    vec4 t01=texelFetch(tex, iCoord + ivec2(0, 1), lod);
    vec4 t11=texelFetch(tex, iCoord + ivec2(1, 1), lod);
    vec4 tx0=mix(t00, t10, f.x);
    vec4 tx1=mix(t01, t11, f.x);
    return mix(tx0, tx1, f.y);
}
vec4 tex(vec2 uv,float mip){
return texelFetchLinear(iChannel0,vec2(uv/exp2(mip)),int(mip));
}
vec3 ACES(vec3 x)
{
    const float a=2.51;
    const float b=0.03;
    const float c=2.43;
    const float d=0.59;
    const float e=0.14;
    return (x * (a * x + b)) / (x * (c * x + d) + e);
}

float hash21(vec2 p) {
    uvec2 q = uvec2(ivec2(p)) * uvec2(1597334677u, 3817691659u);
    uint h = (q.x ^ q.y) * 1597334677u;
    return float(h) * (1.0 / 4294967296.0);
}

const float scale=1.0;
  void main(){
    vec2 fragCoord= gl_FragCoord.xy;

    vec2 iResolution=vec2(640.0,360.0);
    fragColor.rgb=texelFetch(iChannel0,ivec2(fragCoord.xy),0).rgb/2.0;
    
   fragColor.rgb+=texelFetchLinear(iChannel0,vec2(fragCoord.xy/8.0-vec2(1)+vec2(hash21(fragCoord),hash21(fragCoord))),3).rgb/2.0;
   fragColor.rgb+=texelFetchLinear(iChannel0,vec2(fragCoord.xy/4.0-vec2(0.5)),2).rgb;

fragColor.rgb/=2.0;

//fragColor.rgb=ACES(fragColor.rgb*2.0)*1.1;

<script id='composite-shader' type='glsl'>#version 300 es
       
precision highp float;
precision highp sampler2D;
uniform sampler2D iChannel0;
uniform sampler2D iChannel1;
uniform float iTime;
uniform vec3 cam;
uniform vec3 pcam;
uniform float hdr;
uniform float impactFrame;
out vec4 fragColor;

vec3 ACES(vec3 x)
{
    const float a=2.51;
    const float b=0.03;
    const float c=2.43;
    const float d=0.59;
    const float e=0.14;
    return (x * (a * x + b)) / (x * (c * x + d) + e);
}


float hash21(vec2 p) {
    uvec2 q = uvec2(ivec2(p)) * uvec2(1597334677u, 3817691659u);
    uint h = (q.x ^ q.y) * 1597334677u;
    return float(h) * (1.0 / 4294967296.0);
}

const float scale=1.0;
  void main(){
    vec2 fragCoord= gl_FragCoord.xy;

    vec2 iResolution=vec2(640.0,360.0);
    
   
     
 fragColor.rgb=vec3(0.0);
 fragColor.r+=texelFetch(iChannel0,ivec2(fragCoord-vec2(1.0,0.0)),0).r*0.5;
 fragColor.g+=texelFetch(iChannel0,ivec2(fragCoord),0).g*0.45;
 fragColor.b+=texelFetch(iChannel0,ivec2(fragCoord+vec2(1.0,0.0)),0).b*0.40;
 vec3 bl=texelFetch(iChannel1,ivec2(fragCoord),0).rgb;
 fragColor.rgb+=pow(bl,vec3(1.5))*2.5;

fragColor.rgb=ACES(fragColor.rgb*2.9)*1.1;

if(impactFrame>0.01){
  float dir=fragColor.g-length(vec2(dFdx(bl.g),dFdy(bl.g)))*fragColor.g;
  float si=impactFrame*impactFrame*0.3;
  vec2 cc=fragCoord-iResolution*0.5;
  float mi=1.0*dir;
  float lerRad=mix(hash21(vec2(105.0*atan(cc.y/cc.x))),hash21(vec2(105.0*atan(cc.y/cc.x)+1.0)),fract((105.0*atan(cc.y/cc.x))))+fragColor.g-1.4+impactFrame*3.0;
  float m2=4.9*(1.0/(0.01*length(cc)+1.0)+0.35*lerRad)-2.2;
  fragColor.rgb=mix(vec3(smoothstep(0.4-si,0.6+si,m2)-smoothstep(0.475-si,0.525+si,mi)),fragColor.rgb,impactFrame*impactFrame*impactFrame);
}

   

    fragColor.a=1.;


	}

<script id='fluidAdvectionShader' type='glsl'>#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D iChannel0;
uniform float dt;
uniform float dx;
uniform vec2 simSize;
uniform vec4 wind[8];   // xy = position, zw = velocity
uniform vec4 stir;      //Player specific stir.  the player is always there so he is not in wind[]
in vec2 vUv;
out vec4 fragColor;

vec4 fetch(ivec2 c){
    return texelFetch(iChannel0, clamp(c, ivec2(0), ivec2(simSize) - 1), 0);
}
vec2 velAt(vec2 pos){
    return fetch(ivec2(floor(pos))).xy;
}
float curlAt(vec2 fc, float dist){
    vec4 n = fetch(ivec2(fc) + ivec2(0, int(dist)));
    vec4 e = fetch(ivec2(fc) + ivec2(int(dist), 0));
    vec4 s = fetch(ivec2(fc) - ivec2(0, int(dist)));
    vec4 w = fetch(ivec2(fc) - ivec2(int(dist), 0));
    return (e.y - w.y - n.x + s.x) / (2.0 * dist);
}
void main(){
    vec2 fc = vUv * simSize;
    ivec2 ic = ivec2(fc);
    vec4 o = fetch(ic);

    //make sure solid cells do not get influenced
    if (o.w < -1.0) {
        fragColor = vec4(0.0, 0.0, 0.0, -10.0);
        return;
    }

    //semi-lagrangian advection
//faster and not noticably worse than rk4
    vec2 back = fc - o.xy * dt;
    vec4 b = fetch(ivec2(back));
//RK4 version for reference if desired.
/*
vec2 v1 = fetch(ivec2(fc)).xy;
vec2 p1 = fc - 0.5 * dt * v1;

vec2 v2 = fetch(ivec2(p1)).xy;
vec2 p2 = fc - 0.5 * dt * v2;

vec2 v3 = fetch(ivec2(p2)).xy;
vec2 p3 = fc - dt * v3;

vec2 v4 = fetch(ivec2(p3)).xy;

vec2 back = fc - (dt / 6.0) * (v1 + 2.0 * v2 + 2.0 * v3 + v4);

vec4 b = fetch(ivec2(back));
*/

    vec2 nv = b.xy;
    float nw = b.w;
    // don't drag solid into air
    if (nw < -1.0) {
        nw = o.w;
        nv = vec2(0.0);
    }

    //vorticity confinement
    vec2 force = vec2(0.0);
    for (int i = 0; i < 3; i++) {
        float mult = exp2(float(i));
        float oL = abs(curlAt(fc + vec2(-mult, 0.0), mult));
        float oR = abs(curlAt(fc + vec2( mult, 0.0), mult));
        float oB = abs(curlAt(fc + vec2(0.0,-mult), mult));
        float oT = abs(curlAt(fc + vec2(0.0, mult), mult));
        vec2 N = vec2(oR - oL, oT - oB) / (2.0 * mult);
        float nl = length(N);
        vec2 nDir = N / (nl + 0.01);
        force += vec2(nDir.y, -nDir.x) * curlAt(fc, mult) / mult;
    }
    nv += force * 0.0015;

    //wind addition
    for (int i = 0; i < 8; i++) {
        if (wind[i].z == 0.0 && wind[i].w == 0.0) continue;
        vec2 d = fc - wind[i].xy;
        float infl = exp(-dot(d, d) / 12.0);
        nv = mix(nv, wind[i].zw, infl * 0.2);
        nw += (1.0 - nw) * infl * 0.05;
    }

    //player stir addition
    {
        vec2 d = fc - stir.xy;
        float infl = exp(-dot(d, d) / 1.0);
        nv = mix(nv, stir.zw, infl * 0.15);
        nw += (1.0 - nw) * infl * 0.03;
    }

    //clamp to prevent EXPLODESSSSS
    nv = clamp(nv, vec2(-4.0), vec2(4.0));

    //Pressure relaxation
    if (nw < 0.5) nw -= nw / 3000.0;
    else nw += (1.0 - nw) / 3000.0;



    //velocity decay
    nv *= 0.997;

    fragColor = vec4(nv, o.z, nw);
}

</script>
<script id='fluidPressureShader' type='glsl'>#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D iChannel0;
uniform float dx;
uniform vec2 simSize;
in vec2 vUv;
out vec4 fragColor;

vec4 fetch(ivec2 c){
    return texelFetch(iChannel0, clamp(c, ivec2(0), ivec2(simSize) - 1), 0);
}
void main(){
    ivec2 ic = ivec2(vUv * simSize);
    vec4 o = fetch(ic);
    vec4 n = fetch(ic + ivec2(0, 1));
    vec4 e = fetch(ic + ivec2(1, 0));
    vec4 s = fetch(ic - ivec2(0, 1));
    vec4 w = fetch(ic - ivec2(1, 0));

    float p = o.z;
    if (o.w >= 0.0) {
        //neumann boundary technique (check spelling?)
        float pz = o.z;
        float n2 = n.w >= 0.0 ? n.z : pz;
        float e2 = e.w >= 0.0 ? e.z : pz;
        float s2 = s.w >= 0.0 ? s.z : pz;
        float w2 = w.w >= 0.0 ? w.z : pz;

        float div = (e.x - w.x + n.y - s.y) / (1.99 * dx);
        p = 0.25 * (n2 + e2 + s2 + w2 - dx * dx * div);
    }
    fragColor = vec4(o.xy, p, o.w);
}

    
</script>
<script id='fluidGradientShader' type='glsl'>#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D iChannel0;
uniform float dx;
uniform vec2 simSize;
in vec2 vUv;
out vec4 fragColor;

vec4 fetch(ivec2 c){
    return texelFetch(iChannel0, clamp(c, ivec2(0), ivec2(simSize) - 1), 0);
}
void main(){
    ivec2 ic = ivec2(vUv * simSize);
    vec4 o = fetch(ic);
    vec4 n = fetch(ic + ivec2(0, 1));
    vec4 e = fetch(ic + ivec2(1, 0));
    vec4 s = fetch(ic - ivec2(0, 1));
    vec4 w = fetch(ic - ivec2(1, 0));

    vec2 grad = vec2(0.0);
    if (o.w >= 0.0) {
        // zero gradient across solid walls
        grad = vec2(
            (e.w >= 0.0 ? e.z : o.z) - (w.w >= 0.0 ? w.z : o.z),
            (n.w >= 0.0 ? n.z : o.z) - (s.w >= 0.0 ? s.z : o.z)
        );
        grad *= 0.5;
    }
    fragColor = vec4(o.xy - grad, o.z, o.w);
}


</script>

<script id='windParticleVertex' type='glsl'>#version 300 es
precision highp float;
precision highp sampler2D;

in vec4 inData;
out vec4 outData;

uniform sampler2D iChannel0;  //fluid texture
uniform vec2 simSize;
uniform vec2 levelSize; // level size (px)
uniform float dt;
uniform vec2 spawnCenter; //camera position for wrap
uniform vec2 spawnRadius;  //wrap radius

out float vLife;

float rnd(float seed){
    return fract(sin(seed * 12.9898) * 43758.5453);
}
vec4 lfetch(sampler2D tex, vec2 uv, int mipLevel) {
    // Convert normalized UV coordinates to integer texel space
    vec2 exactPixel = uv-vec2(0.5);
    
    ivec2 iCoord = ivec2(floor(exactPixel));
    vec2 f = fract(exactPixel); // Fractional part for weighting
    
    // Fetch 4 neighboring texels
    vec4 tl = texelFetch(tex, iCoord + ivec2(0, 0), mipLevel);
    vec4 tr = texelFetch(tex, iCoord + ivec2(1, 0), mipLevel);
    vec4 bl = texelFetch(tex, iCoord + ivec2(0, 1), mipLevel);
    vec4 br = texelFetch(tex, iCoord + ivec2(1, 1), mipLevel);
    
    // Bilinear interpolation
    vec4 topMix    = mix(tl, tr, f.x);
    vec4 bottomMix = mix(bl, br, f.x);
    return mix(topMix, bottomMix, f.y);
}
void main(){
    vec4 p = inData;

    //particle recycle
    if (p.w <= 0.0 || p.x < 0.0) {
        // vert id seed
        float s = float(gl_VertexID) * 0.618034 + p.x * -0.0137 + spawnCenter.x * 0.0071;
        float ang = rnd(s) * 6.28318;
        float rad = sqrt(rnd(s + 17.0));
        p.x = clamp(spawnCenter.x + cos(ang) * rad * spawnRadius.x, 0.0, levelSize.x);
        p.y = clamp(spawnCenter.y + sin(ang) * rad * spawnRadius.y, 0.0, levelSize.y);
        p.w = 0.3 + rnd(s + 2.0) * 0.7;
    }

    // sample the fluid field
    vec2 tc = vec2(p.xy / (levelSize / simSize));
    vec4 fluid2 = lfetch(iChannel0, clamp(tc, vec2(0), vec2(simSize) - 1.0), 0);
    vec4 fluid = texelFetch(iChannel0, clamp(ivec2(tc), ivec2(0),ivec2(simSize) - 1), 0);
    
    // motes inside solid cells die instantly so they never draw there
    if (fluid.w < 0.0) {
        p.w = 0.0;
    }

    // solid cells have no wind
    vec2 vel = fluid.w >= 0.0 ? fluid2.xy : vec2(0.0);

    p.xy += vel * dt * 1.2;
    p.w -= dt * 0.006;   // slowly burn out then respawn

    outData = p;
    vLife = p.w;
}
</script>
<script id='windParticleFragment' type='glsl'>#version 300 es
precision highp float;
in float vLife;
out vec4 fragColor;
  float rnd(float seed){
    return fract(sin(seed * 12.9898) * 43758.5453);
}
void main(){
    //particle fade in and out
    float fade = smoothstep(0.0, 0.15, vLife) * smoothstep(1.0, 0.85, vLife);
  
    fragColor = vec4(vec3(0.9, 0.82, 1.0)*rnd(floor(gl_FragCoord.x)+40.0*floor(gl_FragCoord.y)), fade * 0.12);
}
</script>
