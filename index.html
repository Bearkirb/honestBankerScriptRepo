async function loadScripts(){

    const dev =
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1";

    const base = dev
        ? "./"
        : "https://cdn.jsdelivr.net/gh/USER/REPO@COMMIT/js/";
    const scripts = [
        "UIAssets.js",
        "testTilemaps.js",
    ];

    for (const file of scripts) {
        const script = document.createElement("script");
        script.src = base + file;

        await new Promise((resolve, reject) => {
            script.onload = resolve;
            script.onerror = () =>
                reject(new Error(`Failed to load ${file}`));

            document.head.appendChild(script);

}

<script id='bloom-shader' type='glsl'>#version 300 es
       
precision highp float;
precision highp sampler2D;
uniform sampler2D iChannel0;
uniform float iTime;
uniform vec3 cam;
uniform vec3 pcam;
uniform float hdr;
out vec4 fragColor;

vec4 texelFetchLinear(sampler2D tex, vec2 coord, int lod)
{
    // Integer base coordinate
    ivec2 iCoord=ivec2(floor(coord));
    
    vec2 f=fract(coord);
	f=f * f * (3.0 - 2.0 * f);
    vec4 t00=texelFetch(tex, iCoord, lod);
    vec4 t10=texelFetch(tex, iCoord + ivec2(1, 0), lod);
    vec4 t01=texelFetch(tex, iCoord + ivec2(0, 1), lod);
    vec4 t11=texelFetch(tex, iCoord + ivec2(1, 1), lod);
    vec4 tx0=mix(t00, t10, f.x);
    vec4 tx1=mix(t01, t11, f.x);
    return mix(tx0, tx1, f.y);
}
vec4 tex(vec2 uv,float mip){
return texelFetchLinear(iChannel0,vec2(uv/exp2(mip)),int(mip));
}
vec3 ACES(vec3 x)
{
    const float a=2.51;
    const float b=0.03;
    const float c=2.43;
    const float d=0.59;
    const float e=0.14;
    return (x * (a * x + b)) / (x * (c * x + d) + e);
}

float hash21(vec2 p) {
    uvec2 q = uvec2(ivec2(p)) * uvec2(1597334677u, 3817691659u);
    uint h = (q.x ^ q.y) * 1597334677u;
    return float(h) * (1.0 / 4294967296.0);
}

const float scale=1.0;
  void main(){

   fragColor.rgb+=texelFetchLinear(iChannel0,vec2(fragCoord.xy/8.0-vec2(1)+vec2(hash21(fragCoord),hash21(fragCoord))),3).rgb/2.0;
   fragColor.rgb+=texelFetchLinear(iChannel0,vec2(fragCoord.xy/4.0-vec2(0.5)),2).rgb;

fragColor.rgb/=2.0;

<script id = 'fluid-shader' type = 'glsl'>#version 300 es
        
precision highp float;
precision highp sampler2D;
uniform sampler2D iChannel0;
uniform float iTime;
uniform vec2 mouse;
uniform vec2 mouseMove;
out vec4 fragColor;

//Tonemap from bruOp https://www.shadertoy.com/view/WdjSW3
float Tonemap_Uchimura(float x, float P, float a, float m, float l, float c, float b) {
    // Uchimura 2017, "HDR theory and practice"
    // Math: https://www.desmos.com/calculator/gslcdxvipg
    // Source: https://www.slideshare.net/nikuque/hdr-theory-and-practicce-jp
    float l0 = ((P - m) * l) / a;
    float L0 = m - m / a;
    float L1 = m + (1.0 - m) / a;
    float S0 = m + l0;
    float S1 = m + a * l0;
    float C2 = (a * P) / (P - S1);
    float CP = -C2 / P;

    float w0 = 1.0 - smoothstep(0.0, m, x);
    float w2 = step(m + l0, x);
    float w1 = 1.0 - w0 - w2;

    float T = m * pow(x / m, c) + b;
    float S = P - (P - S1) * exp(CP * (x - S0));
    float L = m + a * (x - m);

    return T * w0 + L * w1 + S * w2;
}

vec3 Grading(vec3 x) {
    const float P = 1.0;  // max display brightness
    const float a = 1.0;  // contrast
    const float m = 0.22; // linear section start
    const float l = 0.4;  // linear section length
    const float c = 1.33; // black
    const float b = 0.0;  // pedestal
    return vec3(Tonemap_Uchimura(x.r, P, a, m, l, c, b),Tonemap_Uchimura(x.g, P, a, m, l, c, b),Tonemap_Uchimura(x.b, P, a, m, l, c, b));
}

mat2 rotate2d(float _angle){
    return mat2(cos(_angle),-sin(_angle),
                sin(_angle),cos(_angle));
}
vec4 texelFetc(sampler2D iChannel,ivec2 uv,int i){
	return texelFetch(iChannel,ivec2(mod(vec2(uv),vec2(128.0))),i);
}
vec2 get_velocity(vec2 u,vec2 v){
return texture(iChannel0,u/v).xy;
}
float curl(vec2 fc,float dist){
   
	  vec4 n = texelFetc(iChannel0, ivec2(fc) + ivec2(0, dist),0);
    vec4 e = texelFetc(iChannel0, ivec2(fc) + ivec2( dist, 0), 0);
    vec4 s = texelFetc(iChannel0, ivec2(fc) + ivec2( 0,-dist), 0);
    vec4 w = texelFetc(iChannel0, ivec2(fc) + ivec2(-dist, 0), 0);
     float dv_dx = (e.y - w.y) / (2.0 * dist);

    // 3. Compute du/dy (Change in X velocity along Y axis)
    // Top neighbor X velocity minus Bottom neighbor X velocity
    float du_dy = (n.x - s.x) / (2.0 * dist);

    // 4. Return Curl = dv/dx - du/dy
    return dv_dx - du_dy;
}
vec4 rel(vec2 fc,float dist){
	  vec4 n = texelFetc(iChannel0, ivec2(fc) + ivec2(0, dist), 0);
    vec4 e = texelFetc(iChannel0, ivec2(fc) + ivec2( dist, 0), 0);
    vec4 s = texelFetc(iChannel0, ivec2(fc) + ivec2( 0,-dist), 0);
    vec4 w = texelFetc(iChannel0, ivec2(fc) + ivec2(-dist, 0), 0);
    return (n+e+s+w)/4.0;
}
vec2 rotate2D(vec2 v, float angleDegrees) {
    float angleRad = radians(angleDegrees);
    float s = sin(angleRad);
    float c = cos(angleRad);
    mat2 m = mat2(c, s, -s, c); // Column-major order in GLSL
    return m * v;
}
const float dt=0.015;
const float dx=1.0;
const vec2 iResolution=vec2(128.0,128.0);

   	 vec4 o = texelFetc(iChannel0, ivec2(fragCoord), 0);
    vec4 n = texelFetc(iChannel0, ivec2(fragCoord) + ivec2( 0, 1), 0);
    vec4 e = texelFetc(iChannel0, ivec2(fragCoord) + ivec2( 1, 0), 0);
    vec4 s = texelFetc(iChannel0, ivec2(fragCoord) + ivec2( 0,-1), 0);
    vec4 w = texelFetc(iChannel0, ivec2(fragCoord) + ivec2(-1, 0), 0);
    float p=o.b;
    if(o.w>=0.0){
    // divergence of the velocity
    n.w=n.w<0.0?0.0:1.0;
    e.w=e.w<0.0?0.0:1.0;
    s.w=s.w<0.0?0.0:1.0;
    w.w=w.w<0.0?0.0:1.0;

    float div = (e.x - w.x + n.y - s.y) / (1.99*dx);
    
    // one jacobi iteration
    
    p = 0.25* (n.z + e.z + s.z + w.z-dx*dx*div);
}
    fragColor = vec4(o.xy, p, o.w);
 
   	}
   }
